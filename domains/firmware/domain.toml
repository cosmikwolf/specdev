# Firmware domain config (v1).
#
# This file wires the firmware domain to:
#   * its JSON Schema files (schema/firmware/v1/*.schema.yaml)
#   * the graph-check primitives the analyzer runs after structural validation
#   * metadata defaults, severity levels, and cross-language type maps
#
# All primitive names (unique, reference_exists, reachability, acyclic,
# layer_dependency) match the primitives the phase-4 analyzer will expose.

[domain]
name = "firmware"
description = "Embedded firmware modules with a strict layered architecture (PAC → HAL → driver → middleware → application)."

[schemas]
module        = "../../schema/firmware/v1/module.schema.yaml"
ui            = "../../schema/firmware/v1/ui.schema.yaml"
requirements  = "../../schema/firmware/v1/requirements.schema.yaml"
architecture  = "../../schema/firmware/v1/architecture.schema.yaml"

[layers]
order = ["PAC", "HAL", "driver", "middleware", "application"]

[layers.allowed_deps]
PAC         = []
HAL         = ["PAC"]
driver      = ["HAL", "PAC"]
middleware  = ["driver", "HAL", "PAC"]
application = ["middleware", "driver", "HAL", "PAC"]

# Metadata categories every module SHOULD declare. Missing required metadata
# emits META010 during validation.
[required_metadata]
module = ["MemoryModel", "ConcurrencyModel", "ErrorHandling"]

# Severity of each validation rule id. Rule ids are stable across versions.
[validation.rules]
LAYER001   = "error"    # dependency violates allowed_deps table.
LAYER002   = "error"    # cyclic module dependency.
META010    = "error"    # required metadata category missing.
META011    = "warning"  # metadata value disagrees with domain default.
FSM020     = "error"    # initial state not in states[].
FSM021     = "error"    # transition references unknown state.
FSM022     = "warning"  # state unreachable from initial.
PORT030    = "error"    # architecture connection endpoint not found.
TYPE040    = "warning"  # type in action/port not in type_map for language.
REQ001     = "warning"  # requirement id not satisfied by any module.
REQ002     = "error"    # module satisfies[] references unknown requirement id.
REQ003     = "error"    # requirement source[] references unknown source id.
OWN050     = "error"    # two modules own the same hardware resource.
ISR060     = "error"    # action is isr_safe=true and blocking=true simultaneously.
PKG040     = "warning"  # module under specs/modules/<X>/ where <X> is not a declared package.
PKG041     = "info"     # module directly under specs/modules/ in a multi-package project.
PKG042     = "warning"  # [[packages]].source_path does not exist on disk.
PKG043     = "error"    # depends_on / architecture endpoint references an unknown package or module.
PKG044     = "error"    # unqualified reference is ambiguous across multiple packages.
MOD_DEPTH  = "error"    # module file nested deeper than one level under specs/modules/.

# Module-level graph checks. Applied per module spec.
[[module.graph_checks]]
rule = "FSM020"
kind = "reference_exists"
source_field = "state_machines[].initial"
target_field = "state_machines[].states[]"
scope = "per_state_machine"

[[module.graph_checks]]
rule = "FSM021"
kind = "reference_exists"
source_field = "state_machines[].transitions[].from"
target_field = "state_machines[].states[]"
scope = "per_state_machine"

[[module.graph_checks]]
rule = "FSM021"
kind = "reference_exists"
source_field = "state_machines[].transitions[].to"
target_field = "state_machines[].states[]"
scope = "per_state_machine"

[[module.graph_checks]]
rule = "FSM022"
kind = "reachability"
nodes_field  = "state_machines[].states[]"
edges_from   = "state_machines[].transitions[].from"
edges_to     = "state_machines[].transitions[].to"
entry_field  = "state_machines[].initial"
scope = "per_state_machine"

[[module.graph_checks]]
kind = "unique"
field = "ports[].name"
scope = "module"

[[module.graph_checks]]
kind = "unique"
field = "state_machines[].name"
scope = "module"

[[module.graph_checks]]
kind = "unique"
field = "actions[].name"
scope = "module"

[[module.graph_checks]]
kind = "unique"
field = "errors[].variant"
scope = "module"

# Project-level graph checks. Applied across all module specs together.
[[project.graph_checks]]
rule = "LAYER001"
kind = "layer_dependency"
module_layer_field = "modules[].layer"
module_deps_field  = "modules[].depends_on[]"
allowed_deps_table = "layers.allowed_deps"
scope = "project"

[[project.graph_checks]]
rule = "LAYER002"
kind = "acyclic"
nodes_field  = "modules[].name"
edges_from   = "modules[].name"
edges_to     = "modules[].depends_on[]"
scope = "project"

[[project.graph_checks]]
kind = "reference_exists"
source_field = "modules[].depends_on[]"
target_field = "modules[].name"
scope = "project"

[[project.graph_checks]]
rule = "REQ002"
kind = "reference_exists"
source_field = "modules[].satisfies[]"
target_field = "requirements[].id"
scope = "project"

[[project.graph_checks]]
rule = "REQ003"
kind = "reference_exists"
source_field = "requirements[].source[]"
target_field = "sources[].id"
scope = "project"

[[project.graph_checks]]
rule = "PORT030"
kind = "reference_exists"
source_field = "architecture.connections[].from"
target_field = "modules[].ports[].qualified_name"
scope = "project"

[[project.graph_checks]]
rule = "PORT030"
kind = "reference_exists"
source_field = "architecture.connections[].to"
target_field = "modules[].ports[].qualified_name"
scope = "project"

# Baseline values assumed when a module does not override them. Used by
# validation (META011) and by codegen to avoid redundant annotations.
[metadata.defaults.MemoryModel]
allocation = "static_alloc"
owner      = "owned"

[metadata.defaults.ConcurrencyModel]
protection = "none"
isr_safe   = false
reentrant  = false

[metadata.defaults.ErrorHandling]
strategy = "result_type"

[metadata.defaults.Ownership]
owner = "owned"

# Opaque type aliases that map domain-level names to language-specific ones.
# TYPE040 warns if a spec uses a type name that is not covered here and not
# defined inside the project's own type dictionary.
[type_map.rust]
Integer = "i32"
Boolean = "bool"
String  = "String"
Real    = "f64"
GpioPin = "u8"

[type_map.c]
Integer = "int32_t"
Boolean = "bool"
String  = "const char*"
Real    = "double"
GpioPin = "uint8_t"
