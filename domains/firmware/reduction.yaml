metaschema_version: v1

# -----------------------------------------------------------------------------
# Firmware-domain reduction (v1). Maps authored TOML under `specs/` to the
# universal (entities, relations) graph defined by the canonical metaschema
# (closed root-kind and relation-kind enums embedded in the analyzer per
# doc 15 §11 invariant 5; see `specdev-next/10-metaschema.md`). Authored
# TOML is untouched — this file is the sole translation layer.
#
# v1 scoping choices (see specdev-next/10-metaschema.md):
#   * `parent.name` only resolves the enclosing file's `name` field (one level).
#     State entities end up qualified as `<module>.<state>` rather than
#     `<module>.<state_machine>.<state>`; fine while each module declares at
#     most one FSM (every current blinky-a2dp module does).
#   * Types and errors are left as module attributes rather than first-class
#     entities; promote them when a consumer actually needs the edges.
#   * Render hints are inline; revisit if a separate presentation.yaml pays for
#     itself when visualizer views multiply.
# -----------------------------------------------------------------------------

entities:
  - kind: module
    extends: structural
    from: specs/modules/*.toml
    name: "${.name}"
    attrs:
      layer: "layer"
      description: "description"
    render:
      shape: rounded_rect
      group_by: layer

  - kind: port
    extends: structural
    from: specs/modules/*.toml
    for_each: "ports[]"
    name: "${parent.name}.${.name}"
    attrs:
      direction: "direction"
      port_type: "port_type"
      flow_type: "flow_type"
    render:
      shape: port

  - kind: action
    extends: behavioral
    from: specs/modules/*.toml
    for_each: "actions[]"
    name: "${parent.name}.${.name}"
    attrs:
      blocking: "blocking"
      isr_safe: "isr_safe"
      returns: "returns"
      description: "description"
    render:
      shape: rounded_rect

  - kind: state_machine
    extends: structural
    from: specs/modules/*.toml
    for_each: "state_machines[]"
    name: "${parent.name}.${.name}"
    attrs:
      initial: "initial"
      states: "states[]"
    render:
      shape: swimlane

  # States are qualified with the enclosing module, not the state_machine —
  # see the header note. Adequate for one-FSM-per-module projects.
  - kind: state
    extends: state
    from: specs/modules/*.toml
    for_each: "state_machines[].states[]"
    name: "${parent.name}.${.}"
    render:
      shape: rounded_rect

  - kind: requirement
    extends: statement
    from: specs/requirements/*.toml
    for_each: "requirement[]"
    name: "${.id}"
    attrs:
      text: "text"
      verified_by: "verified_by[]"
    render:
      shape: box
      group_by: statement

relations:
  # Module-to-module build/link dependencies.
  - kind: depends_on
    from_kind: module
    to_kind: module
    from_spec: specs/modules/*.toml
    for_each: "depends_on[]"
    endpoints: { from: "${parent.name}", to: "${.}" }

  # Container edges: module contains its ports, actions, and state machines.
  - kind: contains
    from_kind: module
    to_kind: port
    from_spec: specs/modules/*.toml
    for_each: "ports[]"
    endpoints: { from: "${parent.name}", to: "${parent.name}.${.name}" }

  - kind: contains
    from_kind: module
    to_kind: action
    from_spec: specs/modules/*.toml
    for_each: "actions[]"
    endpoints: { from: "${parent.name}", to: "${parent.name}.${.name}" }

  - kind: contains
    from_kind: module
    to_kind: state_machine
    from_spec: specs/modules/*.toml
    for_each: "state_machines[]"
    endpoints: { from: "${parent.name}", to: "${parent.name}.${.name}" }

  # NOTE: state_machine → state containment isn't expressed in v1 because the
  # current template scope exposes only one `parent` level (the file root,
  # i.e. the module). Recovering the state_machine name from inside a
  # nested `state_machines[].states[]` iteration needs nested-parent scope,
  # which 10-metaschema.md punts to the next version bump. Consumers can
  # still reach states via module→state_machine + transitions edges.

  # Architecture wiring — port-to-port. Endpoints arrive fully qualified as
  # `<Module>.<port>` in the TOML, matching the `port` entity names verbatim.
  - kind: connects
    from_kind: port
    to_kind: port
    from_spec: specs/architecture.toml
    for_each: "connections[]"
    endpoints: { from: "${.from}", to: "${.to}" }
    attrs:
      flow_type: "flow_type"

  # Requirement satisfaction. Each module lists the requirement IDs it
  # claims to satisfy directly.
  - kind: satisfies
    from_kind: module
    to_kind: requirement
    from_spec: specs/modules/*.toml
    for_each: "satisfies[]"
    endpoints: { from: "${parent.name}", to: "${.}" }

  # Intra-FSM transitions. States resolve to their module-qualified names.
  - kind: transitions
    from_kind: state
    to_kind: state
    from_spec: specs/modules/*.toml
    for_each: "state_machines[].transitions[]"
    endpoints:
      from: "${parent.name}.${.from}"
      to: "${parent.name}.${.to}"
    attrs:
      event: "event"
      name: "name"
