# The single root view for the counter app. Renders the count plus
# increment / decrement buttons; mutates CounterStore.count directly.

name = "CounterView"
kind = "root_view"
description = "Displays the counter value and increment/decrement buttons."

reads = ["CounterStore.count"]
writes = ["CounterStore.count"]

satisfies = ["REQ-COUNTER-001", "REQ-COUNTER-002"]

[metadata.StateOwnership]
location = "store"

[metadata.UpdateTrigger]
kind = "on_event"

[metadata.ErrorHandling]
strategy = "result_type"

# Widget list order = render order (top-to-bottom).
[[widgets]]
name = "title"
kind = "heading"
label = "Counter"

[[widgets]]
name = "count_label"
kind = "label"
binding = "CounterStore.count"

[[widgets]]
name = "increment_button"
kind = "button"
label = "+"
on_event = "increment"

[[widgets]]
name = "decrement_button"
kind = "button"
label = "-"
on_event = "decrement"

[[actions]]
name = "increment"
description = "Add 1 to CounterStore.count."

[[actions]]
name = "decrement"
description = "Subtract 1 from CounterStore.count."
