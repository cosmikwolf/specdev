# App-level counter state. Persisted across restarts via eframe::Storage.

name = "CounterStore"
description = "Holds the user-facing counter value."
persisted = true

satisfies = ["REQ-COUNTER-001"]

[[fields]]
name = "count"
type = "Integer"
default = "0"
description = "Current counter value; incremented or decremented by CounterView."
