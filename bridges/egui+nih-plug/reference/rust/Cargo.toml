# CI-only reference crate for the egui+nih-plug bridge codegen prose.
# Type-checks the per-widget worked examples in ../../codegen/rust/README.md
# against the pinned nih-plug + egui API. A `std` host-target lib: it builds an
# rlib and type-checks the widget construction without linking/running a plugin.
# NOT inlined into user projects (this dir is a sibling to codegen/, which inline
# never copies from).
#
# nih-plug is git-only. Both revs below must match what the corresponding
# deps.yaml files pin -- `nih_plug` from the nih-plug block, `nih_plug_egui`
# from this bridge's own deps.yaml. The pin checks compare them; a reference
# compiling against a rev users never receive proves nothing.
[package]
name = "egui-nih-plug-reference"
version = "0.0.0"
edition = "2021"
publish = false

[lib]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
