# Reference-crate coverage manifest.
#
# Plugin-author / CI-only — NEVER inlined into user projects (it lives under
# `reference/`, which the inline step does not copy). Declares the discrete
# widget kinds this bridge ships a COMPILED reference example for.
#
# All 8 widget kinds (WIDGET-KIND-V1). Each `src/<kind>.rs` type-checks the
# corresponding worked example in `codegen/rust/README.md` against the pinned
# nih-plug + egui API.
#
# Plus `editor`, the host binding this bridge owns: the create_egui_editor
# closure, the crate-root egui alias, and the legacy panel form that this
# host's egui 0.31 requires.
reference_cases:
  - editor
  - button
  - dropdown
  - knob
  - numeric_field
  - radio_group
  - slider
  - toggle
  - value_display
