# Reference-crate coverage manifest.
#
# Plugin-author / CI-only — NEVER inlined into user projects (it lives under
# `reference/`, which the inline step does not copy). Declares the discrete
# codegen cases this bridge ships a COMPILED reference example for.
#
# `specdev-analyzer plugin-lint` checks, per case <name>:
#   - coverage: `reference/rust/src/<name>.rs` exists;
#   - arity:    every generic type the codegen README names is used at the same
#               generic arity as in the compiled reference source.
#
# The list is the set this bridge currently PROVIDES references for. The bridge
# documents more handoff kinds in its `codegen/rust/README.md` type table
# (uart, spi, tim, adc) that are not yet built; surfacing that gap is the
# deferred *completeness* check (plugin CI / authoring skills), not this
# consistency check.
reference_cases:
  - gpio
  - i2c
  - usart
