# Weekly check that the versions our units pin are still what upstream ships.
#
# Separate from reference-crates.yml on purpose. That workflow answers "is our
# prose correct against the version we pinned" and must stay green on every
# push. This one answers "has the world moved past that pin", which is a
# question about the outside world — it can change with no commit, and it must
# never turn a pull request red for something no one in the diff did.
#
# Scheduled, plus manual dispatch. It reports:
#
#   current            pinned version is still the latest      silent
#   held               behind on purpose, reason on file       silent
#   ahead              the feed's newest is older than the pin silent
#   unswept            no release feed for this language/SDK   informational
#   behind, compiles   newer exists, the reference builds      informational
#   behind, BREAKS     newer exists, the reference fails       fails the job
#
# Only the last fails. A report that cries wolf gets muted, and a muted gate is
# worse than no gate.
name: freshness-sweep

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is the right cadence: a version bump is not
    # urgent, and a daily run trains people to ignore it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyYAML
        # Pinned explicitly rather than relying on what the runner image
        # happens to ship — the sweep reads every deps.yaml through it.
        run: pip install --quiet pyyaml
      # The build-against-latest leg compiles reference crates, so this job
      # needs the SAME environment reference-crates.yml builds in. When the two
      # drift, this sweep does not merely fail — it reports `BREAKS` against
      # dependencies that are fine, which is the one outcome the header above
      # says it must never produce.
      #
      # That is not hypothetical. The first scheduled run (2026-09-14) reported:
      #
      #   ✗ blocks/mk20dx          fugit 0.3 -> 0.6.0        BREAKS (E0463: can't find crate for `core`)
      #   ✗ bridges/egui+nih-plug  nih_plug_egui             BREAKS (custom build command for `x11`)
      #
      # Neither upgrade was tested. The runner could not build those crates at
      # all: mk20dx pins thumbv7em-none-eabi and the egui stack needs the X11
      # window libraries, and this job installed neither.
      - name: Install the window-stack system deps the egui references link
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libgl-dev libasound2-dev libjack-jackd2-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # Must cover every triple pinned under blocks/*/reference/*/ and
          # bridges/*/reference/*/. Identical to reference-crates.yml; both
          # lists are derived from the same command, so re-run it in BOTH when
          # a unit pins a new triple:
          #
          #   find blocks bridges -path '*/reference/*/.cargo/config.toml' \
          #     -exec grep -h '^ *target *=' {} \; | sort -u
          targets: >-
            thumbv7em-none-eabi,
            thumbv7m-none-eabi,
            thumbv8m.main-none-eabihf,
            wasm32-unknown-unknown
      # No Swatinem/rust-cache here. It shells out to cargo at the repository
      # root, and this repository has no root Cargo.toml (reference crates are
      # nested), so it exits 101 with "could not find `Cargo.toml`" and caches
      # nothing. reference-crates.yml does not use it either. An action that
      # logs an error and does no work is worse than an absent one — it makes
      # a healthy log look broken.
      - name: Check the version-satisfaction rule before trusting its verdicts
        run: python3 .github/scripts/freshness_sweep.py --self-test
      - name: Sweep
        run: python3 .github/scripts/freshness_sweep.py
