$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/egui/v1/store.schema.yaml"
title: "egui store spec (v1)"
description: >
  Shape of a single store spec in `specs/stores/*.toml`. A store is an
  app-level state container owned by the eframe::App impl and shared across
  views. One store per file; filename should match the `name` field.
type: object
additionalProperties: false
required: [name, fields]
properties:
  name:
    $ref: "enums.schema.yaml#/$defs/Identifier"
  description:
    type: string
  fields:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/Field" }
  persisted:
    description: >
      If true, the store is loaded from and saved to eframe::Storage on
      startup and shutdown. All fields must be serializable (serde).
    type: boolean
  satisfies:
    type: array
    items: { $ref: "#/$defs/RequirementId" }
    uniqueItems: true

$defs:
  RequirementId:
    type: string
    pattern: "^REQ-[A-Z0-9]+(-[A-Z0-9]+)*-\\d+$"

  Field:
    type: object
    additionalProperties: false
    required: [name, type]
    properties:
      name:
        $ref: "enums.schema.yaml#/$defs/Identifier"
      type:
        description: >
          Domain-level type name, resolved via type_map in domain.toml. May
          also be a raw Rust type (e.g. `Vec<String>`, `Option<i64>`) when
          no domain alias fits.
        type: string
        minLength: 1
      default:
        description: >
          Literal default value for the field, in target-language syntax.
          Codegen emits this in the Default impl. Omit for type defaults.
      description:
        type: string
      derived:
        description: >
          If true, the field is computed from other fields and should not
          be written by views. Codegen generates a read-only accessor
          instead of a public field.
        type: boolean
