$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/egui/v1/enums.schema.yaml"
title: "egui enums (v1)"
description: >
  Shared closed vocabularies used across the egui native-app domain. Every
  enum here is a $defs entry; other schemas reference these via $ref.

$defs:
  ViewKind:
    description: >
      Role of a view in the app composition. `root_view` is mountable into
      a panel slot and may be a navigation target. `panel_view` renders
      inside a parent's layout. `widget_view` is a leaf composition reused
      inside other views. `dialog_view` is shown modally via egui::Window.
    type: string
    enum:
      - root_view
      - panel_view
      - widget_view
      - dialog_view

  PanelSlot:
    description: >
      Where a root view mounts in the eframe window. Maps directly to
      egui::TopBottomPanel / egui::SidePanel / egui::CentralPanel::show.
    type: string
    enum:
      - top
      - bottom
      - left
      - right
      - central

  UpdateTriggerKind:
    description: When a view's update() body re-renders meaningfully.
    type: string
    enum:
      - per_frame
      - on_event
      - on_request

  StateOwnershipKind:
    description: Where a view's state lives.
    type: string
    enum:
      - local
      - store
      - parent

  WidgetKind:
    description: >
      Canonical egui widget vocabulary. Enumerated rather than free-form so
      codegen can exhaustively match. Extend the enum if a widget is
      genuinely missing; do not use the `custom` bucket as a dumping ground.
    type: string
    enum:
      - button
      - label
      - heading
      - hyperlink
      - text_edit_singleline
      - text_edit_multiline
      - checkbox
      - radio_button
      - selectable_label
      - slider
      - drag_value
      - combo_box
      - color_picker
      - separator
      - spinner
      - progress_bar
      - image
      - custom

  ErrorKind:
    description: Error-handling strategy used by a view's fallible actions.
    type: string
    enum:
      - panic
      - enum_variant
      - result_type
      - option

  ParamDirection:
    description: Direction of an action parameter.
    type: string
    enum:
      - in
      - out
      - inout

  Identifier:
    description: snake_case or PascalCase identifier usable in target languages.
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

  ModuleRef:
    description: >
      Reference to a view/module: a bare `Module` identifier, or a package-
      qualified `<package>::<Module>` form used in multi-package projects.
    type: string
    pattern: "^([a-z][a-z0-9_]*::)?[A-Za-z_][A-Za-z0-9_]*$"

  QualifiedBinding:
    description: >
      "Owner.field" reference used by a view's reads[]/writes[] arrays and by
      widget bindings. Owner is a view name or store name; field is a
      declared field on that owner.
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*$"
