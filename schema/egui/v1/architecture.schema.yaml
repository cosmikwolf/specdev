$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/egui/v1/architecture.schema.yaml"
title: "egui architecture spec (v1)"
description: >
  Shape of specs/architecture.toml for egui apps. Declares panel
  composition (which root views mount in which eframe panel slots) and
  navigation (FSM over root views, driving which view is currently
  rendered in the central panel). The analyzer validates at project scope
  that mounts[] and navigation states all reference declared views.
type: object
additionalProperties: false
properties:
  mounts:
    description: >
      Static panel mounts. Each entry assigns one root view to one panel
      slot. `central` is reserved for the active navigation state if
      navigation is declared; otherwise any single view may mount there.
    type: array
    items: { $ref: "#/$defs/Mount" }
  navigation:
    description: >
      FSM over root views shown in the central panel. initial is the
      starting view; states[] lists navigable root views; transitions wire
      user events to view changes.
    $ref: "#/$defs/Navigation"

$defs:
  Mount:
    type: object
    additionalProperties: false
    required: [view, slot]
    properties:
      view:
        $ref: "enums.schema.yaml#/$defs/Identifier"
      slot:
        $ref: "enums.schema.yaml#/$defs/PanelSlot"
      resizable:
        type: boolean
      default_size_px:
        description: >
          Default panel extent in the slot's variable dimension (height
          for top/bottom, width for left/right). Ignored for central.
        type: integer
        minimum: 0

  NavigationTransition:
    type: object
    additionalProperties: false
    required: [from, to, event]
    properties:
      from:  { $ref: "enums.schema.yaml#/$defs/Identifier" }
      to:    { $ref: "enums.schema.yaml#/$defs/Identifier" }
      event: { $ref: "enums.schema.yaml#/$defs/Identifier" }

  Navigation:
    type: object
    additionalProperties: false
    required: [initial, states]
    properties:
      initial:
        $ref: "enums.schema.yaml#/$defs/Identifier"
      states:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: "enums.schema.yaml#/$defs/Identifier" }
      transitions:
        type: array
        items: { $ref: "#/$defs/NavigationTransition" }
