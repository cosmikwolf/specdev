$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/egui/v1/requirements.schema.yaml"
title: "egui requirements file (v1)"
description: >
  Shape of files under specs/requirements/. Each file groups related
  requirements and, optionally, the external sources those requirements
  are derived from (product briefs, design documents, user stories).
  Views and stores reference requirements by id via their top-level
  `satisfies` array. This schema is copied verbatim from the firmware
  domain — requirements are domain-neutral.
type: object
additionalProperties: false
properties:
  source:
    description: >
      External documents that requirements in this file may be derived from.
      Declared once per source and referenced by id from each Requirement's
      `source` array.
    type: array
    items: { $ref: "#/$defs/Source" }
    uniqueItems: true
  requirement:
    type: array
    items: { $ref: "#/$defs/Requirement" }

$defs:
  Source:
    type: object
    additionalProperties: false
    required: [id, kind, title]
    properties:
      id:
        description: Stable identifier referenced by Requirement.source[].
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      kind:
        type: string
        enum: [protocol, user, regulatory, derived]
      title:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
      url:
        type: string
        format: uri

  Requirement:
    type: object
    additionalProperties: false
    required: [id, text]
    properties:
      id:
        type: string
        pattern: "^REQ-[A-Z0-9]+(-[A-Z0-9]+)*-\\d+$"
      text:
        type: string
        minLength: 1
      satisfies:
        type: array
        items:
          type: string
          pattern: "^REQ-[A-Z0-9]+(-[A-Z0-9]+)*-\\d+$"
        uniqueItems: true
      source:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        uniqueItems: true
      source_ref:
        type: string
        minLength: 1
      verified_by:
        type: array
        items: { type: string, minLength: 1 }
