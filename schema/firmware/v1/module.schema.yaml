$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/firmware/v1/module.schema.yaml"
title: "Firmware module spec (v1)"
description: >
  Shape of a single module spec in `specs/modules/*.toml`. One module per
  file; filename should match the `name` field.
type: object
additionalProperties: false
required: [name, layer]
properties:
  name:
    $ref: "enums.schema.yaml#/$defs/Identifier"
  layer:
    $ref: "enums.schema.yaml#/$defs/LayerKind"
  description:
    type: string
  depends_on:
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/Identifier" }
    uniqueItems: true
  external_deps:
    type: array
    items: { $ref: "#/$defs/ExternalDep" }
  satisfies:
    type: array
    items: { $ref: "#/$defs/RequirementId" }
    uniqueItems: true
  metadata:
    $ref: "metadata.schema.yaml#/$defs/MetadataObject"
  hardware:
    $ref: "#/$defs/Hardware"
  ports:
    type: array
    items: { $ref: "#/$defs/Port" }
  actions:
    type: array
    items: { $ref: "#/$defs/Action" }
  state_machines:
    type: array
    items: { $ref: "#/$defs/StateMachine" }
  errors:
    type: array
    items: { $ref: "#/$defs/ErrorVariant" }

$defs:
  RequirementId:
    description: "Identifier of a requirement defined under specs/requirements/."
    type: string
    pattern: "^REQ-[A-Z0-9]+(-[A-Z0-9]+)*-\\d+$"

  ExternalDep:
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name:    { type: string, minLength: 1 }
      version: { type: string, minLength: 1 }
      features:
        type: array
        items: { type: string }

  Port:
    type: object
    additionalProperties: false
    required: [name, port_type, direction]
    properties:
      name:       { $ref: "enums.schema.yaml#/$defs/Identifier" }
      port_type:  { $ref: "enums.schema.yaml#/$defs/Identifier" }
      direction:  { $ref: "enums.schema.yaml#/$defs/PortDirection" }
      conjugated: { type: boolean }
      flow_type:  { type: string }

  ActionParam:
    type: object
    additionalProperties: false
    required: [name, type, direction]
    properties:
      name:      { $ref: "enums.schema.yaml#/$defs/Identifier" }
      type:      { type: string, minLength: 1 }
      direction: { $ref: "enums.schema.yaml#/$defs/ParamDirection" }

  Action:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:        { $ref: "enums.schema.yaml#/$defs/Identifier" }
      description: { type: string }
      params:
        type: array
        items: { $ref: "#/$defs/ActionParam" }
      returns:     { type: string }
      blocking:    { type: boolean }
      isr_safe:    { type: boolean }

  Transition:
    type: object
    additionalProperties: false
    required: [from, to, event]
    properties:
      name:   { $ref: "enums.schema.yaml#/$defs/Identifier" }
      from:   { $ref: "enums.schema.yaml#/$defs/Identifier" }
      to:     { $ref: "enums.schema.yaml#/$defs/Identifier" }
      event:  { $ref: "enums.schema.yaml#/$defs/Identifier" }
      guard:  { type: string }
      action: { type: string }

  StateMachine:
    type: object
    additionalProperties: false
    required: [name, initial, states]
    properties:
      name:    { $ref: "enums.schema.yaml#/$defs/Identifier" }
      initial: { $ref: "enums.schema.yaml#/$defs/Identifier" }
      states:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: "enums.schema.yaml#/$defs/Identifier" }
      transitions:
        type: array
        items: { $ref: "#/$defs/Transition" }

  ErrorVariant:
    type: object
    additionalProperties: false
    required: [variant]
    properties:
      variant:     { $ref: "enums.schema.yaml#/$defs/Identifier" }
      description: { type: string }

  Hardware:
    description: >
      Hardware attributes for this module. Loosely typed in v1; each entry
      type below has known keys but accepts unknown keys too, so domain
      evolution does not break existing specs.
    type: object
    additionalProperties: false
    properties:
      pins:
        type: array
        items: { $ref: "#/$defs/HardwarePin" }
      clocks:
        type: array
        items: { $ref: "#/$defs/HardwareClock" }
      peripherals:
        type: array
        items: { $ref: "#/$defs/HardwarePeripheral" }

  HardwarePin:
    type: object
    additionalProperties: true
    required: [name]
    properties:
      name:   { type: string }
      port:   { type: string }
      pin:    { type: integer, minimum: 0 }
      alt_fn: { type: integer, minimum: 0 }
      role:   { type: string }

  HardwareClock:
    type: object
    additionalProperties: true
    required: [name]
    properties:
      name:         { type: string }
      frequency_hz: { type: integer, minimum: 0 }

  HardwarePeripheral:
    type: object
    additionalProperties: true
    required: [name]
    properties:
      name:         { type: string }
      base_address: { type: integer, minimum: 0 }
      role:         { type: string }
