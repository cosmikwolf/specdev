$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/firmware/v1/ui.schema.yaml"
title: "Firmware UI spec (v1 — minimal first pass)"
description: >
  Minimal shape for specs/ui/*.toml. Expanded in later minor versions once
  real UI specs land (current examples are firmware-only). Unknown keys
  under displays / input_devices / indicators / screens / navigation are
  accepted so authoring ergonomics beat schema strictness for v1.
type: object
additionalProperties: false
required: [name]
properties:
  name:
    $ref: "enums.schema.yaml#/$defs/Identifier"
  description:
    type: string
  displays:
    type: array
    items: { $ref: "#/$defs/Display" }
  input_devices:
    type: array
    items: { $ref: "#/$defs/InputDevice" }
  indicators:
    type: array
    items: { $ref: "#/$defs/Indicator" }
  screens:
    type: array
    items: { $ref: "#/$defs/Screen" }
  navigation:
    $ref: "#/$defs/Navigation"

$defs:
  Display:
    type: object
    additionalProperties: true
    required: [name]
    properties:
      name:   { type: string }
      width:  { type: integer, minimum: 1 }
      height: { type: integer, minimum: 1 }

  InputDevice:
    type: object
    additionalProperties: true
    required: [name]
    properties:
      name: { type: string }
      kind: { type: string }

  Indicator:
    type: object
    additionalProperties: true
    required: [name]
    properties:
      name: { type: string }
      kind: { type: string }

  Screen:
    type: object
    additionalProperties: true
    required: [name]
    properties:
      name: { type: string }

  Navigation:
    type: object
    additionalProperties: false
    required: [initial, states]
    properties:
      initial: { $ref: "enums.schema.yaml#/$defs/Identifier" }
      states:
        type: array
        items: { $ref: "enums.schema.yaml#/$defs/Identifier" }
      transitions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [from, to, event]
          properties:
            from:  { $ref: "enums.schema.yaml#/$defs/Identifier" }
            to:    { $ref: "enums.schema.yaml#/$defs/Identifier" }
            event: { $ref: "enums.schema.yaml#/$defs/Identifier" }
