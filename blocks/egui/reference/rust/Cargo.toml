# CI-only reference crate for the egui block codegen prose.
# Type-checks the editor-closure + panel emission examples in
# ../../codegen/rust/README.md against pinned egui + nih_plug_egui. A std
# host-target lib (type-checks without linking the GUI backend). NOT inlined.
[package]
name = "egui-reference"
version = "0.0.0"
edition = "2021"
publish = false

[lib]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
