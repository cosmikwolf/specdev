# CI-only reference crate for the egui block codegen prose.
# Type-checks the panel + region emission examples in
# ../../codegen/rust/README.md. A std host-target lib (type-checks without
# linking a rendering backend). NOT inlined.
#
# The block itself contributes NO crates -- egui always arrives from a host
# (`eframe::egui` from the eframe block, `nih_plug_egui::egui` from the
# egui+nih-plug bridge). This reference therefore declares egui directly and
# re-exports it from lib.rs, standing in for a host so the topology prose has
# something to compile against. That is why deps.yaml and this manifest do
# not agree on a crate list, and why they are not required to: the pin checks
# compare only crates declared in BOTH.
#
# TWO eguis, deliberately. The shipped hosts straddle egui's panel-API break:
# nih_plug_egui supplies 0.31 (SidePanel/TopBottomPanel, `show(&Context)`)
# and eframe 0.36 supplies 0.36 (unified Panel, `show(&mut Ui)`). The block's
# prose documents both forms, so both need a compiled witness or half the
# panel table ships unverified. Renaming keeps them apart; no type crosses
# between them, and no user project ever receives this pairing.
[package]
name = "egui-reference"
version = "0.0.0"
edition = "2021"
publish = false

[lib]

[dependencies]
# Modern form: the API from egui 0.35 onward. Tracks the eframe host.
egui = "0.36"
# Legacy form: pre-0.34. Tracks the nih_plug_egui host, which pins 0.31.
egui_legacy = { package = "egui", version = "0.31" }
