# CI-only reference crate for the mk20dx block codegen prose.
# Type-checks the worked examples in ../../codegen/rust/README.md against
# the published mk20dx-hal API. NOT inlined (inline never copies
# `reference/`).
#
# The dependency set is EXACTLY what the block's deps.yaml contributes —
# nothing more — so a green build here is evidence the contribution
# builds on its own. The `mk20d7` feature pulls the PAC in as `mk20d7`;
# on crates.io that PAC is `mk20d7-pac` (bare `mk20d7` is an unrelated
# 2018 crate), renamed inside the HAL's manifest via `package =`.
[package]
name = "mk20dx-reference"
version = "0.0.0"
edition = "2021"
publish = false

[lib]

[dependencies]
mk20dx-hal = { version = "0.1.1", features = ["mk20d7", "rt", "critical-section"] }
