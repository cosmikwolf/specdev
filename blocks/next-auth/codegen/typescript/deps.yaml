# Manifest — npm deps the next-auth block contributes.
# Schema: specdev-analyzer/src/embedded/block_deps.schema.yaml.
#
# Inlined alongside codegen/typescript/README.md during
# `specdev inline next-auth`; participates in the block's per-unit
# content_hash.
#
# The pin is a PRE-RELEASE, deliberately, and the reasoning mirrors the
# itm block's `0.9.0-rc.1`.
#
# `5.0.0-beta.32` is what the `beta` dist-tag resolves to. The `latest`
# tag is `4.24.15`, and it is not a usable alternative here: v4 predates
# the single-config, `handlers`-export shape this block is built on, and
# authjs.dev — the project's own current documentation — documents v5
# only. v4 lives on the previous documentation domain. Choosing the
# `latest` tag would mean teaching an API the upstream project no longer
# documents.
#
# The pin is EXACT, not a caret. A caret on a pre-release accepts the
# next beta, and a beta may break between betas; an exact pin makes the
# move deliberate. Measured 2026-09-10.
#
# Both majors peer-admit Next 16, so the Next version is not what
# decides this.
#
# NOTE for the freshness sweep: this row reports `ahead` today, because
# the pin's major is above the `latest` tag's. It will report `current`
# the day 5.0.0 ships, since the comparison drops the pre-release
# identifier — so the sweep will NOT tell you to leave the beta. The GA
# is a manual trigger; see README.md.

npm:
  - package: next-auth
    version: "5.0.0-beta.32"

# `@auth/prisma-adapter` is deliberately absent. It is a join product:
# it exists only when this block and the `prisma` block are both
# present, and a project that inlines this block alone would receive a
# dependency it cannot satisfy. It is contributed by the
# `next-auth+prisma` bridge instead.
recommended_external_deps:
  - crate: "@auth/core"
    purpose: "Types for custom providers; next-auth re-exports most of it."
