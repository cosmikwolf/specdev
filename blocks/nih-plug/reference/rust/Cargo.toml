# CI-only reference crate for the nih-plug block codegen prose.
# Type-checks the parameter-struct + range-constructor examples in
# ../../codegen/rust/README.md against pinned nih-plug. A std host-target lib
# (type-checks param construction without running a plugin). NOT inlined.
[package]
name = "nih-plug-reference"
version = "0.0.0"
edition = "2021"
publish = false

[lib]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
