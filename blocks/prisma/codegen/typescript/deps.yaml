# Manifest — npm deps the prisma block contributes.
# Schema: specdev-analyzer/src/embedded/block_deps.schema.yaml.
#
# Inlined alongside codegen/typescript/README.md during
# `specdev inline prisma`; participates in the block's per-unit
# content_hash.
#
# ONE dep is contributed, and the rest are suggestions. That split is
# forced by two measured facts, not by taste.
#
#   1. Block contributions are runtime `dependencies`. `NpmEntry` carries
#      no `test_only` key, by design — dev-dep routing is a spec-side
#      `external_deps` concern. The `prisma` CLI is a devDependency in
#      Prisma's own documented install, so it cannot be contributed here.
#      Same shape as the flutter-rust-bridge block, which contributes the
#      runtime package and leaves its codegen CLI to a user action.
#
#   2. Prisma 7 makes a driver adapter mandatory, and the adapter package
#      is chosen per database. Eight adapters ship; exactly one applies
#      to any project. A static list cannot choose, so the adapter is the
#      author's to add, driven by `[prisma.datasource].adapter`.
#
# `@prisma/client` is the one package every prisma project needs
# whatever its database, so it is the one the block contributes.
# The caret allows 7.x patches. Do NOT widen it to `^8`: the `latest`
# dist-tag on the `prisma` CLI is a RELEASE CANDIDATE (8.0.0-rc.13,
# measured 2026-09-10), and 8 is not GA. See reference/typescript/
# pin-policy.yaml for the hold the freshness sweep reads.

npm:
  - package: "@prisma/client"
    version: "^7.10.0"

# Every entry here is a user action. The CLI and `dotenv` are needed by
# every project; exactly one adapter is needed by each. The version of
# the CLI and of the adapter must MATCH the client — Prisma publishes
# all three from one release, and a mismatch fails at generate time.
recommended_external_deps:
  - crate: prisma
    purpose: "Prisma CLI, test_only; same version as @prisma/client."
  - crate: dotenv
    purpose: "test_only; prisma.config.ts imports it to read DATABASE_URL."
  - crate: "@prisma/adapter-pg"
    purpose: "Driver adapter for postgresql. Needs the `pg` driver."
  - crate: "@prisma/adapter-neon"
    purpose: "Driver adapter for postgresql over Neon serverless."
  - crate: "@prisma/adapter-better-sqlite3"
    purpose: "Driver adapter for local sqlite. Compiles a native module."
  - crate: "@prisma/adapter-libsql"
    purpose: "Driver adapter for sqlite over libSQL / Turso."
  - crate: "@prisma/adapter-d1"
    purpose: "Driver adapter for sqlite on Cloudflare D1." # PLANNING-OK: D1 is Cloudflare's product name, not a decision id
  - crate: "@prisma/adapter-mariadb"
    purpose: "Driver adapter for mysql and mariadb."
  - crate: "@prisma/adapter-planetscale"
    purpose: "Driver adapter for mysql over PlanetScale."
  - crate: "@prisma/adapter-mssql"
    purpose: "Driver adapter for sqlserver."
