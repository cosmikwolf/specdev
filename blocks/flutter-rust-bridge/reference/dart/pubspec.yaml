# CI-only reference package for the flutter-rust-bridge block codegen prose.
# Type-checks the worked examples in ../../codegen/dart/README.md against the
# REAL generator output in lib/src/rust/ (committed at the pinned codegen
# version). NOT inlined — this dir is a sibling to codegen/.
name: frb_reference
description: CI-only reference package for the flutter-rust-bridge block.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
