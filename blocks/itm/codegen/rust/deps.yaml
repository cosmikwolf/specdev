# Manifest — Cargo deps the itm block contributes.
# Schema: specdev-analyzer/src/embedded/block_deps.schema.yaml.
#
# Inlined alongside codegen/rust/README.md during `specdev inline itm`;
# participates in the block's per-unit content_hash.
#
# The pin is a RELEASE CANDIDATE, deliberately. 0.9.0-rc.1 (2022) is the
# newest published version and the only one carrying the current
# TracePacket vocabulary; the 0.3.1 "stable" (2018) predates the DWT
# packet support this block is built on and is not a usable alternative.
# The pin matches what probe-rs itself uses in its own trace example, so
# this is the path the ecosystem actually takes rather than an
# adventurous choice. Cargo needs the pre-release named exactly.
#
# `default-features = false` leaves out the `serial` feature, which pulls
# `nix` for reading a trace stream off a tty. This block takes its bytes
# from any `std::io::Read`, so that transport is never needed here.

crates:
  - name: itm
    version: "0.9.0-rc.1"
    features: []
    source: crates-io

# The decoder yields owned packets; anything further is the project's
# choice. `serde` is listed because persisting a decoded trace to a file
# is the common next step, and the itm crate can derive it directly.
recommended_external_deps:
  - crate: serde
    purpose: "Serializes decoded packets; itm derives it behind a feature."
