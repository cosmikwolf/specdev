# CI-only reference crate for the itm block codegen prose.
# Type-checks the decoder / stimulus-port / data-watch worked examples in
# ../../codegen/rust/README.md against the pinned itm API. A std
# host-target lib: the decoder reads from any `std::io::Read`, so every
# example type-checks with a byte slice standing in for a live stream.
# NOT inlined -- this dir is a sibling to codegen/.
#
# The pin must match codegen/rust/deps.yaml, including the pre-release
# suffix. Bump both together, never one alone.
[package]
name = "itm-reference"
version = "0.0.0"
edition = "2021"
publish = false

[lib]

[dependencies]
# `default-features = false` drops the `serial` feature (and its `nix`
# dependency), which reads a trace stream off a tty. This block takes its
# bytes from any reader, so that transport is never needed.
itm = { version = "0.9.0-rc.1", default-features = false }
