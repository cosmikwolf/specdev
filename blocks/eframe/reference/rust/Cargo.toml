# CI-only reference crate for the eframe block codegen prose. Type-checks the
# worked examples in ../../codegen/rust/README.md against the pinned eframe API.
# A std host lib: it type-checks every example without opening a window.
# NOT inlined — this dir is a sibling to codegen/.
[package]
name = "eframe-reference"
version = "0.0.0"
edition = "2021"
publish = false

[lib]

[dependencies]
eframe = { version = "0.36", features = ["persistence", "glow"] }
serde = { version = "1", features = ["derive"] }
